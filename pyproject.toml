[project]
name = "lamad"
version = "0.1.0"
description = "CAD tooling built on build123d: scripted parts, STEP export, metrics, and a browser viewer."
readme = "README.md"
authors = [
    { name = "Matthew Hyatt", email = "mhyatt000@gmail.com" }
]
# OCCT bindings (cadquery-ocp, via build123d) have no wheels for 3.13+.
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d>=0.9",
    "click>=8.0",
    "manifold3d>=3.5.2",
    # NOTE: torch 2.2.x (Intel Mac) was compiled against NumPy 1.x and warns under
    # NumPy 2, but build123d requires numpy>=2, so numpy cannot be pinned <2.
    "pillow>=10.0",
    "rich>=14.3.4",
    # `lamad re compare` with an STL reference: trimesh loads the mesh and
    # samples surface distances; its closest-point queries need rtree.
    "rtree>=1.0",
    "scipy>=1.15.3",
    # torch dropped macOS x86_64 wheels after 2.2; Intel Macs get the last one.
    "torch>=2.14.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2,<2.3 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tqdm>=4.70.0",
    "trimesh>=4.0",
    "tyro>=1.0.16",
    "viser>=1.1.0",
]

[project.scripts]
lamad = "lamad:main"

[project.optional-dependencies]
reverse-engineering = [
    "shapely>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
build123d = { git = "https://github.com/gumyr/build123d" }
